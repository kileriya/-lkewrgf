<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест по JavaScript</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    :root {
        --lav-1: #f3e9ff;
        --lav-2: #e3d1ff;
        --lav-3: #c9b0f5;
        --lav-4: #a98ee8;
        --lav-5: #7c5fc4;
        --lav-deep: #4a3a7a;
        --lav-dark: #2b2147;
        --accent: #b79cff;
        --good: #7fd8b0;
        --bad: #ff8fa3;
    }

    * { box-sizing: border-box; }

    body {
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--lav-dark);
        background: radial-gradient(ellipse at 20% 10%, #4b3a86 0%, #2b2147 45%, #1a1230 100%);
        overflow-x: hidden;
        position: relative;
    }

    /* ===== Звёздное небо ===== */
    #stars, #stars2, #stars3 {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        opacity: .9;
        box-shadow: 0 0 6px 1px rgba(255,255,255,.8);
    }

    /* Падающие звёзды */
    .shooting-star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 8px 2px #fff;
        opacity: 0;
    }

    .shooting-star::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 0;
        width: 120px;
        height: 1.5px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 100%);
        transform: translateY(-50%);
        filter: blur(.3px);
    }

    @keyframes shoot {
        0%   { opacity: 0; transform: translate(0,0) rotate(35deg); }
        8%   { opacity: 1; }
        100% { opacity: 0; transform: translate(-520px, 380px) rotate(35deg); }
    }

    /* ===== Контейнер ===== */
    .wrap {
        position: relative;
        z-index: 2;
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 16px 60px;
    }

    .card-glass {
        background: linear-gradient(160deg, rgba(243,233,255,.96), rgba(227,209,255,.92));
        border: 1px solid rgba(255,255,255,.6);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(20,10,45,.55), inset 0 1px 0 rgba(255,255,255,.8);
        backdrop-filter: blur(8px);
        padding: 38px 36px;
        animation: floatIn .7s ease both;
    }

    @keyframes floatIn {
        from { opacity: 0; transform: translateY(24px) scale(.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1.title {
        font-weight: 800;
        letter-spacing: .5px;
        color: var(--lav-deep);
        text-align: center;
        margin-bottom: 6px;
        text-shadow: 0 2px 0 rgba(255,255,255,.6);
    }

    .subtitle {
        text-align: center;
        color: #6a5a99;
        margin-bottom: 26px;
        font-size: 1.02rem;
    }

    /* ===== Прогресс ===== */
    .progress {
        height: 12px;
        border-radius: 999px;
        background: rgba(169,142,232,.25);
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(74,58,122,.25);
    }

    .progress-bar {
        background: linear-gradient(90deg, var(--lav-3), var(--lav-5));
        transition: width .45s cubic-bezier(.4,.8,.3,1);
    }

    .counter {
        font-weight: 700;
        color: var(--lav-5);
        letter-spacing: .5px;
    }

    /* ===== Вопрос и ответы ===== */
    .question {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--lav-deep);
        margin: 22px 0 20px;
        line-height: 1.4;
        animation: fadeSlide .4s ease both;
    }

    @keyframes fadeSlide {
        from { opacity: 0; transform: translateX(14px); }
        to   { opacity: 1; transform: translateX(0); }
    }

    .answer-btn {
        display: block;
        width: 100%;
        text-align: left;
        border: 2px solid rgba(169,142,232,.45);
        background: rgba(255,255,255,.65);
        color: var(--lav-dark);
        border-radius: 16px;
        padding: 15px 18px;
        margin-bottom: 12px;
        font-size: 1.02rem;
        font-weight: 500;
        cursor: pointer;
        transition: all .22s ease;
        position: relative;
        overflow: hidden;
    }

    .answer-btn:hover:not(:disabled) {
        background: #fff;
        border-color: var(--lav-4);
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(124,95,196,.28);
    }

    .answer-btn:disabled { cursor: default; }

    .answer-btn .badge-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--lav-3), var(--lav-4));
        color: #fff;
        font-weight: 700;
        font-size: .85rem;
        margin-right: 12px;
        flex-shrink: 0;
    }

    .answer-btn .content { display: flex; align-items: center; }

    .answer-btn.correct {
        background: linear-gradient(135deg, #d7f7e6, #b8f0d2);
        border-color: #6fd0a1;
        color: #1c6b46;
        animation: pulseGood .45s ease;
    }

    .answer-btn.wrong {
        background: linear-gradient(135deg, #ffe0e6, #ffc4d0);
        border-color: #ff8fa3;
        color: #8a1f34;
        animation: shake .4s ease;
    }

    .answer-btn.correct .badge-num { background: #4cc38a; }
    .answer-btn.wrong   .badge-num { background: #ff6b85; }

    @keyframes pulseGood {
        0% { transform: scale(1); }
        50% { transform: scale(1.025); }
        100% { transform: scale(1); }
    }

    @keyframes shake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }

    /* ===== Кнопки ===== */
    .btn-lav {
        background: linear-gradient(135deg, var(--lav-4), var(--lav-5));
        border: none;
        color: #fff;
        font-weight: 700;
        letter-spacing: .4px;
        border-radius: 14px;
        padding: 13px 34px;
        box-shadow: 0 10px 24px rgba(124,95,196,.45);
        transition: all .25s ease;
    }

    .btn-lav:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(124,95,196,.6);
        color: #fff;
    }

    .btn-lav:disabled {
        opacity: .45;
        box-shadow: none;
    }

    .btn-ghost {
        background: transparent;
        border: 2px solid var(--lav-4);
        color: var(--lav-5);
        font-weight: 700;
        border-radius: 14px;
        padding: 11px 30px;
        transition: all .25s ease;
    }

    .btn-ghost:hover {
        background: var(--lav-4);
        color: #fff;
        transform: translateY(-2px);
    }

    /* ===== Экран результата ===== */
    .result-screen { text-align: center; animation: floatIn .6s ease both; }

    .result-emoji {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 10px;
        animation: floaty 2.4s ease-in-out infinite;
    }

    @keyframes floaty {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .score-ring {
        width: 190px;
        height: 190px;
        margin: 14px auto 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(closest-side, #f3e9ff 79%, transparent 80% 100%),
            conic-gradient(var(--lav-5) calc(var(--pct) * 1%), rgba(169,142,232,.25) 0);
        box-shadow: 0 16px 40px rgba(74,58,122,.35), inset 0 0 0 1px rgba(255,255,255,.6);
        position: relative;
    }

    .score-ring .score-text {
        font-size: 2.6rem;
        font-weight: 800;
        color: var(--lav-deep);
    }

    .score-ring .score-sub {
        display: block;
        font-size: .85rem;
        font-weight: 600;
        color: #7c6aa8;
        letter-spacing: .5px;
    }

    .result-msg {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--lav-deep);
        margin-bottom: 24px;
    }

    .review-item {
        text-align: left;
        background: rgba(255,255,255,.55);
        border-left: 4px solid var(--lav-4);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 10px;
        font-size: .95rem;
        color: var(--lav-dark);
    }

    .review-item .q { font-weight: 700; margin-bottom: 4px; color: var(--lav-deep); }
    .review-item .a-good { color: #1c6b46; font-weight: 600; }
    .review-item .a-bad  { color: #a12a3f; font-weight: 600; }

    @media (max-width: 576px) {
        .card-glass { padding: 26px 20px; }
        .question { font-size: 1.12rem; }
        .answer-btn { font-size: .96rem; padding: 13px 14px; }
        h1.title { font-size: 1.6rem; }
    }
</style>
</head>
<body>

<!-- Звёзды -->
<div id="stars"></div>
<div id="stars2"></div>
<div id="stars3"></div>

<div class="wrap">
    <div class="card-glass">

        <!-- ===== Стартовый экран ===== -->
        <div id="startScreen">
            <h1 class="title">✨ Тест по JavaScript ✨</h1>
            <p class="subtitle">10 вопросов · 4 варианта ответа · проверь себя!</p>
            <div class="text-center mt-4">
                <button class="btn btn-lav btn-lg" onclick="startQuiz()">Начать тест</button>
            </div>
        </div>

        <!-- ===== Экран вопросов ===== -->
        <div id="quizScreen" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="counter" id="counter">Вопрос 1 / 10</span>
                <span class="counter" id="scoreLive">Баллы: 0</span>
            </div>
            <div class="progress mb-1">
                <div class="progress-bar" id="progressBar" style="width:0%"></div>
            </div>

            <h2 class="question" id="questionText"></h2>
            <div id="answersBox"></div>

            <div class="text-center mt-4">
                <button class="btn btn-lav btn-lg" id="nextBtn" onclick="nextQuestion()" disabled>
                    Далее →
                </button>
            </div>
        </div>

        <!-- ===== Экран результата ===== -->
        <div id="resultScreen" class="result-screen" style="display:none;">
            <div class="result-emoji" id="resultEmoji">🏆</div>
            <h1 class="title">Результат</h1>
            <div class="score-ring" id="scoreRing" style="--pct:0;">
                <div>
                    <span class="score-text" id="scoreText">0</span>
                    <span class="score-sub" id="scoreSub">из 10</span>
                </div>
            </div>
            <p class="result-msg" id="resultMsg"></p>

            <div id="reviewBox" class="mb-4"></div>

            <button class="btn btn-ghost" onclick="restartQuiz()">↻ Пройти заново</button>
        </div>

    </div>
</div>

<script>
/* ============================================================
   ВОПРОСЫ
   ============================================================ */
const QUESTIONS = [
    {
        q: "Каким ключевым словом объявляется переменная, значение которой можно менять?",
        options: ["const", "let", "var const", "final"],
        correct: 1
    },
    {
        q: "Что выведет код: <code>console.log(typeof 42)</code>?",
        options: ['"number"', '"int"', '"integer"', '"float"'],
        correct: 0
    },
    {
        q: "Какой оператор используется для строгого сравнения (без приведения типов)?",
        options: ["==", "=", "===", "!="],
        correct: 2
    },
    {
        q: "Какая функция выводит сообщение в консоль браузера?",
        options: ["print()", "console.log()", "alert()", "document.write()"],
        correct: 1
    },
    {
        q: "Какой результат выражения <code>\"5\" + 3</code>?",
        options: ["8", '"53"', "NaN", "Ошибка"],
        correct: 1
    },
    {
        q: "Что вернёт функция <code>prompt()</code>?",
        options: ["Число", "Строку", "Логическое значение", "Массив"],
        correct: 1
    },
    {
        q: "Какой цикл гарантированно выполнится хотя бы один раз?",
        options: ["for", "while", "do...while", "for...of"],
        correct: 2
    },
    {
        q: "Что делает метод <code>Number(\"12\")</code>?",
        options: [
            "Превращает строку в число 12",
            "Округляет число",
            "Проверяет, является ли значение числом",
            "Возвращает длину строки"
        ],
        correct: 0
    },
    {
        q: "Как объявить функцию с именем <code>sum</code>, принимающую два аргумента?",
        options: [
            "func sum(a, b) {}",
            "function sum(a, b) {}",
            "def sum(a, b) {}",
            "sum(a, b) => {}"
        ],
        correct: 1
    },
    {
        q: "Что вернёт выражение <code>10 % 3</code>?",
        options: ["3", "1", "0", "3.33"],
        correct: 1
    }
];

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let current = 0;
let score = 0;
let answered = false;
let userAnswers = []; // { chosen: index|null, correct: bool }

/* ============================================================
   ЗВЁЗДЫ
   ============================================================ */
function createStars(containerId, count, sizeMax) {
    const box = document.getElementById(containerId);
    for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const size = Math.random() * sizeMax + 1;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.opacity = (Math.random() * 0.6 + 0.3).toFixed(2);
        // мерцание
        s.style.animation = `twinkle ${(Math.random() * 3 + 2).toFixed(1)}s ease-in-out ${(Math.random() * 3).toFixed(1)}s infinite alternate`;
        box.appendChild(s);
    }
}

// добавляем keyframes мерцания через JS (чтобы не плодить в CSS)
const styleSheet = document.createElement("style");
styleSheet.textContent = `
@keyframes twinkle {
    from { opacity: .2; transform: scale(.8); }
    to   { opacity: 1;  transform: scale(1.25); }
}`;
document.head.appendChild(styleSheet);

createStars("stars", 120, 2);
createStars("stars2", 70, 2.6);
createStars("stars3", 40, 3.2);

/* Падающие звёзды */
function spawnShootingStar() {
    const star = document.createElement("div");
    star.className = "shooting-star";
    star.style.left = (Math.random() * 70 + 30) + "%";
    star.style.top = (Math.random() * 40) + "%";
    const dur = (Math.random() * 1.4 + 1.2).toFixed(2);
    star.style.animation = `shoot ${dur}s linear forwards`;
    document.body.appendChild(star);
    setTimeout(() => star.remove(), dur * 1000 + 100);
}

// запускаем падающие звёзды с случайным интервалом
function scheduleShootingStar() {
    spawnShootingStar();
    setTimeout(scheduleShootingStar, Math.random() * 2200 + 900);
}
scheduleShootingStar();

/* ============================================================
   ЛОГИКА ТЕСТА
   ============================================================ */
function startQuiz() {
    current = 0;
    score = 0;
    answered = false;
    userAnswers = [];

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";

    renderQuestion();
}

function renderQuestion() {
    answered = false;
    const q = QUESTIONS[current];

    document.getElementById("counter").textContent =
        `Вопрос ${current + 1} / ${QUESTIONS.length}`;
    document.getElementById("scoreLive").textContent = `Баллы: ${score}`;
    document.getElementById("progressBar").style.width =
        `${(current / QUESTIONS.length) * 100}%`;

    const qText = document.getElementById("questionText");
    qText.innerHTML = q.q;
    // перезапуск анимации
    qText.style.animation = "none";
    void qText.offsetWidth;
    qText.style.animation = "";

    const box = document.getElementById("answersBox");
    box.innerHTML = "";
    const letters = ["A", "B", "C", "D"];

    q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.innerHTML = `<span class="content">
            <span class="badge-num">${letters[i]}</span>
            <span>${opt}</span>
        </span>`;
        btn.onclick = () => selectAnswer(i, btn);
        box.appendChild(btn);
    });

    document.getElementById("nextBtn").disabled = true;
    document.getElementById("nextBtn").textContent =
        current === QUESTIONS.length - 1 ? "Показать результат ✨" : "Далее →";
}

function selectAnswer(index, btn) {
    if (answered) return;
    answered = true;

    const q = QUESTIONS[current];
    const isCorrect = index === q.correct;
    const buttons = document.querySelectorAll("#answersBox .answer-btn");

    buttons.forEach((b, i) => {
        b.disabled = true;
        if (i === q.correct) b.classList.add("correct");
        if (i === index && !isCorrect) b.classList.add("wrong");
    });

    if (isCorrect) score++;

    userAnswers.push({
        chosen: index,
        correct: isCorrect
    });

    document.getElementById("scoreLive").textContent = `Баллы: ${score}`;
    document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
    if (!answered) return;

    current++;
    if (current < QUESTIONS.length) {
        renderQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quizScreen").style.display = "none";
    const res = document.getElementById("resultScreen");
    res.style.display = "block";

    const total = QUESTIONS.length;
    const pct = Math.round((score / total) * 100);

    // кольцо
    const ring = document.getElementById("scoreRing");
    ring.style.setProperty("--pct", 0);
    // анимация заполнения кольца
    let cur = 0;
    const step = Math.max(1, Math.round(pct / 30));
    const timer = setInterval(() => {
        cur += step;
        if (cur >= pct) { cur = pct; clearInterval(timer); }
        ring.style.setProperty("--pct", cur);
    }, 18);

    document.getElementById("scoreText").textContent = score;
    document.getElementById("scoreSub").textContent = `из ${total}`;

    // эмодзи и сообщение
    let emoji = "🏆", msg = "";
    if (pct === 100)      { emoji = "🌟"; msg = "Идеально! Ты настоящий JS-ниндзя!"; }
    else if (pct >= 80)   { emoji = "🎉"; msg = "Отличный результат! Почти всё верно."; }
    else if (pct >= 60)   { emoji = "👍"; msg = "Хорошо! Но есть куда расти."; }
    else if (pct >= 40)   { emoji = "📘"; msg = "Неплохо, стоит повторить основы."; }
    else                  { emoji = "💪"; msg = "Не сдавайся! Повтори материал и попробуй снова."; }

    document.getElementById("resultEmoji").textContent = emoji;
    document.getElementById("resultMsg").textContent = msg;

    // разбор ответов
    const review = document.getElementById("reviewBox");
    review.innerHTML = "<h5 class='mb-3' style='color:#4a3a7a;font-weight:800;'>Разбор ответов</h5>";
    const letters = ["A", "B", "C", "D"];

    QUESTIONS.forEach((q, i) => {
        const ua = userAnswers[i];
        const chosenText = ua && ua.chosen !== null
            ? `${letters[ua.chosen]}) ${q.options[ua.chosen]}`
            : "— (нет ответа)";
        const correctText = `${letters[q.correct]}) ${q.options[q.correct]}`;

        const div = document.createElement("div");
        div.className = "review-item";
        div.innerHTML = `
            <div class="q">${i + 1}. ${q.q}</div>
            <div>Твой ответ: <span class="${ua && ua.correct ? 'a-good' : 'a-bad'}">${chosenText}</span></div>
            ${ua && ua.correct ? "" : `<div>Правильно: <span class="a-good">${correctText}</span></div>`}
        `;
        review.appendChild(div);
    });
}

function restartQuiz() {
    document.getElementById("resultScreen").style.display = "none";
    startQuiz();
}
</script>
</body>
</html>
