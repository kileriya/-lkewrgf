<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Блэкаут: Выживание</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
        scroll-snap-type: y mandatory;
        overflow-y: auto;
        height: 100%;
        background: #050508;
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #050508;
        color: #d8d4e0;
        overflow-x: hidden;
    }

    /* ===== ЭКРАН ===== */
    .screen {
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    .screen::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        background: radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,0.55) 100%);
    }

    .screen::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ===== ФОНОВЫЕ СЛОИ ===== */
    .bg-layer {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
    }

    .bg-apartment {
        background:
            radial-gradient(ellipse at 50% 20%, #1a1625 0%, #0a0810 70%),
            linear-gradient(180deg, #0f0d18 0%, #050508 100%);
    }

    .bg-apartment::before {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 38%;
        background: linear-gradient(180deg, transparent 0%, #0a0812 100%);
        border-top: 2px solid #1a1528;
    }

    .window-frame {
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%);
        width: 38%;
        max-width: 280px;
        height: 32%;
        border: 4px solid #1e1a2e;
        border-radius: 8px;
        background: radial-gradient(ellipse at 50% 30%, #1a1528 0%, #08060e 100%);
        box-shadow: inset 0 0 60px rgba(0,0,0,0.8), 0 0 40px rgba(20,15,40,0.5);
    }

    .window-frame::after {
        content: '';
        position: absolute;
        top: 50%; left: 0; right: 0;
        height: 3px;
        background: #1e1a2e;
    }

    .window-frame::before {
        content: '';
        position: absolute;
        top: 0; bottom: 0;
        left: 50%;
        width: 3px;
        background: #1e1a2e;
    }

    .bg-street {
        background:
            radial-gradient(ellipse at 50% 80%, #1a1525 0%, #050508 70%),
            linear-gradient(180deg, #08060e 0%, #0a0812 100%);
    }

    .building {
        position: absolute;
        bottom: 22%;
        background: #0a0812;
        border: 1px solid #1a1528;
    }

    .building::before {
        content: '';
        position: absolute;
        top: 15%; left: 20%;
        width: 15%; height: 12%;
        background: #1a1225;
        box-shadow:
            0 0 8px 2px rgba(255,180,80,0.15),
            0 18px 0 #0f0d18,
            18px 0 0 #0f0d18,
            36px 0 0 #0f0d18;
    }

    .bg-school {
        background:
            radial-gradient(ellipse at 50% 30%, #141a28 0%, #050508 70%);
    }

    .school-facade {
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: 70%;
        max-width: 420px;
        height: 50%;
        background: #0f0d18;
        border: 2px solid #1a1528;
        border-radius: 4px;
    }

    .school-facade::before {
        content: '';
        position: absolute;
        top: 12%; left: 8%;
        width: 14%; height: 18%;
        background: #1a1a28;
        box-shadow:
            28px 0 0 #1a1a28,
            56px 0 0 #1a1a28,
            84px 0 0 #1a1a28,
            112px 0 0 #1a1a28,
            140px 0 0 #1a1a28;
    }

    .school-facade::after {
        content: '';
        position: absolute;
        bottom: 0; left: 30%;
        width: 40%; height: 35%;
        background: #141220;
        border-radius: 8px 8px 0 0;
        box-shadow: 0 0 30px rgba(255,200,100,0.08);
    }

    .bg-river {
        background:
            radial-gradient(ellipse at 50% 70%, #0a1020 0%, #030508 70%);
    }

    .river-water {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 35%;
        background: linear-gradient(180deg, #0a1020 0%, #050810 100%);
        border-top: 2px solid #101828;
    }

    .river-water::before {
        content: '';
        position: absolute;
        top: 10%; left: 10%;
        width: 80%; height: 2px;
        background: rgba(80,120,180,0.15);
        box-shadow:
            0 10px 0 rgba(80,120,180,0.1),
            0 20px 0 rgba(80,120,180,0.08),
            40px 5px 0 rgba(80,120,180,0.12);
        animation: waterShift 6s ease-in-out infinite;
    }

    @keyframes waterShift {
        0%, 100% { transform: translateX(0); opacity: 0.8; }
        50% { transform: translateX(-15px); opacity: 1; }
    }

    .boat {
        position: absolute;
        bottom: 28%;
        left: 55%;
        width: 120px;
        height: 30px;
        background: #1a1520;
        border: 2px solid #2a2038;
        border-radius: 0 0 50% 50% / 0 0 100% 100%;
        transform: rotate(-5deg);
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        animation: boatRock 5s ease-in-out infinite;
    }

    @keyframes boatRock {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(-3deg) translateY(-3px); }
    }

    .bg-death {
        background:
            radial-gradient(ellipse at 50% 40%, #2a0a15 0%, #050205 80%);
        animation: deathPulse 4s ease-in-out infinite;
    }

    @keyframes deathPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
    }

    /* ===== ОГНИ ===== */
    .light-source {
        position: absolute;
        border-radius: 50%;
        z-index: 1;
        pointer-events: none;
    }

    .light-candle {
        width: 10px;
        height: 10px;
        background: #ffb347;
        box-shadow:
            0 0 20px 6px rgba(255,179,71,0.5),
            0 0 60px 20px rgba(255,179,71,0.15),
            0 0 100px 40px rgba(255,150,50,0.05);
        animation: candleFlicker 3s ease-in-out infinite;
    }

    @keyframes candleFlicker {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        30% { opacity: 1; transform: scale(1.1); }
        60% { opacity: 0.7; transform: scale(0.95); }
        80% { opacity: 0.95; transform: scale(1.05); }
    }

    .light-danger {
        width: 12px;
        height: 12px;
        background: #c84a5a;
        box-shadow:
            0 0 25px 8px rgba(200,74,90,0.5),
            0 0 70px 25px rgba(200,74,90,0.15);
        animation: dangerPulse 1.5s ease-in-out infinite;
    }

    @keyframes dangerPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
    }

    /* ===== ПОДСКАЗКИ ===== */
    .hint-item {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        animation: hintGlow 2s ease-in-out infinite;
    }

    @keyframes hintGlow {
        0%, 100% {
            opacity: 0.55;
            filter: drop-shadow(0 0 6px rgba(160,220,255,0.4));
        }
        50% {
            opacity: 1;
            filter: drop-shadow(0 0 16px rgba(160,220,255,0.9));
        }
    }

    .hint-arrow {
        font-size: 26px;
        color: #a8dcff;
        text-shadow: 0 0 12px rgba(140,200,255,0.8);
        animation: arrowBounce 1.4s ease-in-out infinite;
    }

    @keyframes arrowBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    .hint-object {
        font-size: 30px;
        filter: drop-shadow(0 0 10px rgba(160,220,255,0.8));
    }

    .hint-mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(168,220,255,0.15);
        border: 1.5px solid rgba(168,220,255,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        color: #a8dcff;
        text-shadow: 0 0 8px rgba(140,200,255,0.9);
    }

    .hint-glow {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(140,200,255,0.22) 0%, transparent 70%);
        animation: hintPulse 2.4s ease-in-out infinite;
    }

    @keyframes hintPulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.35); opacity: 1; }
    }

    /* ===== ЧАСТИЦЫ ===== */
    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255,220,160,0.6);
        box-shadow: 0 0 6px 2px rgba(255,200,120,0.35);
        z-index: 2;
        pointer-events: none;
        animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
        0%   { transform: translate(0, 0) scale(1); opacity: 0; }
        10%  { opacity: 0.9; }
        50%  { opacity: 0.6; }
        100% { transform: translate(var(--dx, 30px), -120px) scale(0.3); opacity: 0; }
    }

    /* ===== ЧЕЛОВЕЧКИ ===== */
    .character {
        position: absolute;
        z-index: 3;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.7));
        transition: transform 0.4s ease;
    }

    .character-body {
        position: relative;
        width: 60px;
        height: 120px;
    }

    .char-head {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 38px;
        background: #e8c9a8;
        border-radius: 50%;
        border: 2px solid rgba(0,0,0,0.3);
    }

    .char-head::after {
        content: '';
        position: absolute;
        top: 12px;
        left: 8px;
        width: 5px;
        height: 5px;
        background: #1a1a2a;
        border-radius: 50%;
        box-shadow: 18px 0 0 #1a1a2a;
    }

    .char-torso {
        position: absolute;
        top: 36px;
        left: 50%;
        transform: translateX(-50%);
        width: 34px;
        height: 44px;
        background: linear-gradient(180deg, #3a2e5a 0%, #2a1e4a 100%);
        border-radius: 8px 8px 4px 4px;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .char-arm {
        position: absolute;
        top: 40px;
        width: 12px;
        height: 34px;
        background: #e8c9a8;
        border-radius: 6px;
        transform-origin: top center;
        border: 1px solid rgba(0,0,0,0.2);
    }

    .char-arm.left {
        left: 2px;
        transform: rotate(12deg);
        animation: armSway 3s ease-in-out infinite;
    }

    .char-arm.right {
        right: 2px;
        transform: rotate(-12deg);
        animation: armSway 3s ease-in-out infinite reverse;
    }

    @keyframes armSway {
        0%, 100% { transform: rotate(12deg); }
        50% { transform: rotate(20deg); }
    }

    .char-leg {
        position: absolute;
        top: 78px;
        width: 13px;
        height: 38px;
        background: #1a1a28;
        border-radius: 5px;
        transform-origin: top center;
    }

    .char-leg.left {
        left: 14px;
        animation: legShift 3s ease-in-out infinite;
    }

    .char-leg.right {
        right: 14px;
        animation: legShift 3s ease-in-out infinite reverse;
    }

    @keyframes legShift {
        0%, 100% { transform: rotate(2deg); }
        50% { transform: rotate(-2deg); }
    }

    .character.companion .char-head { background: #d4a574; }
    .character.companion .char-torso {
        background: linear-gradient(180deg, #2a4a3a 0%, #1a3a2a 100%);
    }

    .character.doctor .char-torso {
        background: linear-gradient(180deg, #e8e8f0 0%, #c8c8d8 100%);
        border: 1px solid rgba(255,255,255,0.4);
    }
    .character.doctor .char-head { background: #f0d4b8; }
    .character.doctor::after {
        content: '✚';
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #d84a5a;
        text-shadow: 0 0 6px rgba(216,74,90,0.5);
    }

    .character.volunteer .char-torso {
        background: linear-gradient(180deg, #ff8a3a 0%, #d86a2a 100%);
        border: 1px solid rgba(255,200,150,0.3);
    }
    .character.volunteer::after {
        content: '♥';
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #fff;
    }

    .character.enemy .char-head { background: #a8a0a0; }
    .character.enemy .char-torso {
        background: linear-gradient(180deg, #2a1a1a 0%, #1a0a0a 100%);
        border: 1px solid rgba(200,60,60,0.2);
    }
    .character.enemy::after {
        content: '⚠';
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #ff6a7a;
        text-shadow: 0 0 8px rgba(255,80,100,0.6);
    }

    .character.neighbor .char-head { background: #d4b8a0; }
    .character.neighbor .char-torso {
        background: linear-gradient(180deg, #6a4a5a 0%, #4a2a3a 100%);
    }
    .character.neighbor::after {
        content: '';
        position: absolute;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
        width: 42px;
        height: 18px;
        border-radius: 50% 50% 0 0;
        background: #8a6a7a;
        z-index: -1;
    }

    /* ===== КОНТЕНТ — СМЕЩЁН ВЛЕВО ===== */
    .content-panel {
        position: relative;
        z-index: 10;
        width: 100%;
        padding: 0 16px 22px;
        animation: panelUp 0.5s ease both;
        display: flex;
        justify-content: flex-start; /* панель слева */
    }

    @keyframes panelUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .story-card {
        background: linear-gradient(180deg, rgba(14,11,24,0.95) 0%, rgba(8,6,15,0.98) 100%);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(90,75,140,0.28);
        border-radius: 22px;
        padding: 20px 18px 22px;
        box-shadow:
            0 -4px 30px rgba(0,0,0,0.6),
            inset 0 1px 0 rgba(160,140,220,0.12);
        width: min(440px, 100%); /* фиксированная ширина, прижата влево */
        margin: 0; /* убираем автоцентрирование */
        position: relative;
        overflow: hidden;
    }

    .story-card::before {
        content: '';
        position: absolute;
        top: 0; left: 10%; right: 10%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(150,120,230,0.6), transparent);
        border-radius: 2px;
    }

    .story-card::after {
        content: '';
        position: absolute;
        top: -60px; right: -60px;
        width: 140px; height: 140px;
        background: radial-gradient(circle, rgba(120,90,200,0.12) 0%, transparent 70%);
        pointer-events: none;
    }

    .chapter-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 3.5px;
        color: #8a7ab0;
        margin-bottom: 8px;
        font-weight: 700;
        padding: 4px 10px 4px 8px;
        background: rgba(90,75,140,0.15);
        border: 1px solid rgba(120,100,180,0.25);
        border-radius: 20px;
    }

    .chapter-tag::before {
        content: '✦';
        font-size: 9px;
        color: #b8a0e0;
        animation: starTwinkle 2s ease-in-out infinite;
    }

    @keyframes starTwinkle {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    .story-card h2 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 10px;
        color: #ece8f5;
        line-height: 1.22;
        letter-spacing: 0.2px;
        text-shadow: 0 1px 8px rgba(120,100,200,0.25);
    }

    .story-card p {
        font-size: 14px;
        line-height: 1.55;
        color: #aaa4bc;
        margin-bottom: 16px;
    }

    .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(120,100,180,0.35), transparent);
        margin: 0 0 14px;
        position: relative;
    }

    .divider::after {
        content: '◆';
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 7px;
        color: #7a6aa8;
        background: #0c0a18;
        padding: 0 8px;
    }

    .choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .choice-btn {
        background: linear-gradient(135deg, rgba(52,42,88,0.95), rgba(36,27,62,0.95));
        border: 1px solid rgba(100,82,158,0.4);
        border-radius: 14px;
        padding: 14px 40px 14px 16px;
        color: #d8d4e8;
        font-size: 14px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
        line-height: 1.35;
        position: relative;
        overflow: hidden;
        font-family: inherit;
    }

    .choice-btn::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(170,150,240,0.12), transparent);
        transition: left 0.55s ease;
    }

    .choice-btn:hover::before { left: 100%; }

    .choice-btn:hover {
        background: linear-gradient(135deg, rgba(74,60,120,0.98), rgba(54,42,90,0.98));
        border-color: rgba(150,130,210,0.65);
        transform: translateY(-1px);
        box-shadow:
            0 6px 22px rgba(70,50,130,0.4),
            0 0 0 1px rgba(150,130,210,0.15);
        color: #f0ecfa;
    }

    .choice-btn:active { transform: scale(0.985); }

    .choice-btn::after {
        content: '›';
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(160,140,210,0.5);
        font-size: 22px;
        font-weight: 300;
        transition: transform 0.25s ease, color 0.25s ease;
    }

    .choice-btn:hover::after {
        transform: translateY(-50%) translateX(4px);
        color: rgba(190,170,240,0.9);
    }

    .hint-btn {
        background: linear-gradient(135deg, rgba(30,60,90,0.9), rgba(20,40,60,0.9));
        border: 1px solid rgba(100,180,220,0.35);
        border-radius: 14px;
        padding: 10px 16px;
        color: #a8dcff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: all 0.25s ease;
        width: 100%;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .hint-btn:hover {
        background: linear-gradient(135deg, rgba(40,80,120,0.95), rgba(30,55,85,0.95));
        border-color: rgba(140,210,255,0.6);
        box-shadow: 0 4px 18px rgba(80,160,220,0.3);
        color: #d0ecff;
    }

    .hint-btn .hint-icon {
        font-size: 15px;
        animation: hintPulse 2s ease-in-out infinite;
    }

    .hint-box {
        background: linear-gradient(135deg, rgba(30,60,90,0.25), rgba(20,40,60,0.15));
        border-left: 3px solid #6ab8e8;
        padding: 10px 14px;
        border-radius: 0 10px 10px 0;
        margin-top: 8px;
        font-size: 13px;
        color: #a8dcff;
        line-height: 1.45;
        animation: hintSlide 0.4s ease both;
    }

    @keyframes hintSlide {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .death-card {
        border-color: rgba(180,50,70,0.35) !important;
        box-shadow:
            0 -4px 30px rgba(0,0,0,0.6),
            inset 0 1px 0 rgba(220,80,100,0.15),
            0 0 40px rgba(150,30,50,0.15);
    }

    .death-card::before {
        background: linear-gradient(90deg, transparent, rgba(200,60,80,0.7), transparent);
    }

    .death-card .chapter-tag {
        color: #c86a7a;
        background: rgba(150,40,60,0.15);
        border-color: rgba(180,60,80,0.3);
    }

    .death-card .chapter-tag::before { color: #e88a9a; }
    .death-card h2 { color: #ff8a9a; text-shadow: 0 1px 10px rgba(200,50,80,0.4); }

    .death-hint {
        background: linear-gradient(135deg, rgba(180,50,70,0.15), rgba(120,30,50,0.1));
        border-left: 3px solid #b04a5a;
        padding: 10px 14px;
        border-radius: 0 10px 10px 0;
        margin-top: 8px;
        font-size: 13px;
        color: #e8a0b0;
        line-height: 1.45;
    }

    .win-card {
        border-color: rgba(60,180,120,0.35) !important;
        box-shadow:
            0 -4px 30px rgba(0,0,0,0.6),

    }

    .restart-btn {
        background: linear-gradient(135deg, #4a3a6a, #2a1e4a);

        border-radius: 30px;
        padding: 13px 36px;
        color: #d8d4e8;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;

        width: 100%;
        letter-spacing: 0.5px;
        font-family: inherit;
        position: relative;
        overflow: hidden;
    }

    .restart-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(160,130,240,0.25) 0%, transparent 70%);
        opacity: 0;
        transition: opacity 0.3s;

        background: linear-gradient(135deg, #5a4a7a, #3a2e5a);
        transform: translateY(-1px);
        box-shadow: 0 6px 22px rgba(70,50,130,0.45);
        color: #f0ecfa;
    }

    /* ===== ПРОГРЕСС ===== */
    .progress-dots {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .progress-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(80,70,120,0.3);
        transition: all 0.35s ease;
    }

    .progress-dot.active {
        background: #a890e0;
        box-shadow: 0 0 10px rgba(160,140,230,0.7), 0 0 20px rgba(160,140,230,0.3);
        transform: scale(1.5);
    }

    .progress-dot.death {
        background: #c84a5a;
        box-shadow: 0 0 8px rgba(200,74,90,0.5);
    }

    .progress-dot.win {
        background: #5ac88a;
        box-shadow: 0 0 8px rgba(90,200,138,0.5);
    }

    .scroll-hint {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        color: rgba(140,120,190,0.45);
        font-size: 11px;
        animation: bounceHint 2s infinite;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        letter-spacing: 1px;
    }

    .scroll-hint .arrow {
        font-size: 14px;
        color: rgba(170,150,230,0.6);
    }

    @keyframes bounceHint {
        0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.45; }
        50% { transform: translateX(-50%) translateY(5px); opacity: 0.9; }

    @media (max-width: 720px) {

    }

        .chapter-tag { font-size: 9px; letter-spacing: 2.5px; }
        .hint-object { font-size: 24px; }
        .hint-arrow { font-size: 20px; }
    }
</style>

        choices: [], bg: 'death', death: true,
        deathText: 'Огонь в закрытом помещении — смертельная ошибка.',
        hintObjects: [
            { type: 'mark', char: '🔥', x: '50%', y: '40%' }
        ],
        npcs: []
    },
    deathSister: {
        chapter: 'Конец', title: 'Потеря',
        text: 'Ты ждал слишком долго. Сестре становилось всё хуже. Помощь пришла слишком поздно.',
        choices: [], bg: 'death', death: true,
        deathText: 'Иногда риск оправдан, когда на кону жизнь близкого человека.',
        hintObjects: [
            { type: 'mark', char: '✖', x: '50%', y: '40%' }
        ],
        npcs: [
            { type: 'companion', x: 'calc(50% + 90px)', y: '30%', scale: 0.6 }
        ]
    },
    deathGreed: {
        chapter: 'Конец', title: 'Жадность',
        text: 'Ты попытался забрать припасы силой. Соседка позвала на помощь. В темноте всё закончилось плохо.',
        choices: [], bg: 'death', death: true,
        deathText: 'В трудные времена сотрудничество важнее силы.',
        hintObjects: [
            { type: 'mark', char: '✖', x: '50%', y: '40%' }
        ],
        npcs: [
            { type: 'neighbor', x: 'calc(50% - 100px)', y: '30%', scale: 0.8 }
        ]
    },
    deathCrowd: {
        chapter: 'Конец', title: 'Давка',
        text: 'Ты попал в толпу у торгового центра. Началась давка. В темноте и панике ты потерял сестру из виду.',
        choices: [], bg: 'death', death: true,
        deathText: 'Большие скопления людей в чрезвычайной ситуации — смертельная опасность.',
        hintObjects: [
            { type: 'mark', char: '✖', x: '50%', y: '40%' }
        ],
        npcs: [
            { type: 'enemy', x: 'calc(50% - 120px)', y: '30%', scale: 0.85 },
            { type: 'enemy', x: 'calc(50% + 120px)', y: '30%', scale: 0.85 }
        ]
    },
    deathRiver: {
        chapter: 'Конец', title: 'Река',
        text: 'Ты попытался переплыть реку в темноте. Течение оказалось сильнее, чем ты думал.',
        choices: [], bg: 'death', death: true,
        deathText: 'Не рискуй понапрасну, когда можно остаться на месте и дождаться помощи.',
        hintObjects: [
            { type: 'mark', char: '🌊', x: '50%', y: '40%' }
        ],
        npcs: []
    }
};

/* ============================================================
   ДВИЖОК
   ============================================================ */
const container = document.getElementById('gameContainer');
const progressDots = document.getElementById('progressDots');
const scrollHint = document.getElementById('scrollHint');

let currentNodeId = 'start';
let visitedNodes = [];

function spawnParticles(screen, color, count) {
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (Math.random() * 100) + '%';
        p.style.top = (30 + Math.random() * 50) + '%';
        p.style.background = color;
        p.style.boxShadow = `0 0 6px 2px ${color.replace('0.6', '0.35')}`;
        p.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
        const dur = (4 + Math.random() * 5).toFixed(1);
        p.style.animationDuration = dur + 's';
        p.style.animationDelay = (Math.random() * dur) + 's';
        screen.appendChild(p);
    }
}

function createBackground(type) {
    const frag = document.createDocumentFragment();

    if (type === 'apartment') {
        const bg = document.createElement('div');
        bg.className = 'bg-layer bg-apartment';
        frag.appendChild(bg);

        const win = document.createElement('div');
        win.className = 'window-frame';
        frag.appendChild(win);

        for (let i = 0; i < 3; i++) {
            const light = document.createElement('div');
            light.className = 'light-source light-candle';
            light.style.left = (15 + i * 30 + Math.random() * 10) + '%';
            light.style.top = (25 + Math.random() * 35) + '%';
            light.style.animationDelay = (i * 0.7) + 's';
            frag.appendChild(light);
        }
    } else if (type === 'street') {
        const bg = document.createElement('div');
        bg.className = 'bg-layer bg-street';
        frag.appendChild(bg);

        const buildings = [
            { left: '5%', w: '22%', h: '45%' },
            { left: '30%', w: '18%', h: '55%' },
            { left: '52%', w: '25%', h: '40%' },
            { left: '80%', w: '20%', h: '50%' }
        ];
        buildings.forEach(b => {
            const bd = document.createElement('div');
            bd.className = 'building';
            bd.style.left = b.left;
            bd.style.width = b.w;
            bd.style.height = b.h;
            frag.appendChild(bd);
        });

        for (let i = 0; i < 4; i++) {
            const light = document.createElement('div');
            light.className = 'light-source light-candle';
            light.style.left = (10 + Math.random() * 80) + '%';
            light.style.top = (20 + Math.random() * 30) + '%';
            light.style.animationDelay = (i * 0.5) + 's';
            frag.appendChild(light);
        }
    } else if (type === 'school') {
        const bg = document.createElement('div');
        bg.className = 'bg-layer bg-school';
        frag.appendChild(bg);

        const facade = document.createElement('div');
        facade.className = 'school-facade';
        frag.appendChild(facade);

        for (let i = 0; i < 3; i++) {
            const light = document.createElement('div');
            light.className = 'light-source light-candle';
            light.style.left = (25 + i * 22) + '%';
            light.style.top = (32 + Math.random() * 15) + '%';
            light.style.animationDelay = (i * 0.6) + 's';
            frag.appendChild(light);
        }
    } else if (type === 'river') {
        const bg = document.createElement('div');
        bg.className = 'bg-layer bg-river';
        frag.appendChild(bg);

        const water = document.createElement('div');
        water.className = 'river-water';
        frag.appendChild(water);

        const boat = document.createElement('div');
        boat.className = 'boat';
        frag.appendChild(boat);

        const light = document.createElement('div');
        light.className = 'light-source light-candle';
        light.style.left = '58%';
        light.style.top = '48%';
        frag.appendChild(light);
    } else if (type === 'death') {
        const bg = document.createElement('div');
        bg.className = 'bg-layer bg-death';
        frag.appendChild(bg);

        for (let i = 0; i < 5; i++) {
            const light = document.createElement('div');
            light.className = 'light-source light-danger';
            light.style.left = (10 + Math.random() * 80) + '%';
            light.style.top = (15 + Math.random() * 55) + '%';
            light.style.animationDelay = (i * 0.3) + 's';
            frag.appendChild(light);
        }
    }

    return frag;
}

function createHintObjects(hints) {
    const frag = document.createDocumentFragment();
    if (!hints || !hints.length) return frag;

    hints.forEach(h => {
        const el = document.createElement('div');
        el.className = 'hint-item';
        el.style.left = h.x;
        el.style.top = h.y;

        if (h.type === 'arrow') {
            el.classList.add('hint-arrow');
            el.textContent = h.char || '↑';
        } else if (h.type === 'mark') {
            const inner = document.createElement('div');
            inner.className = 'hint-mark';
            inner.textContent = h.char || '!';
            el.appendChild(inner);
        } else if (h.type === 'object') {
            el.classList.add('hint-object');
            el.textContent = h.icon || '?';
        } else if (h.type === 'glow') {
            el.classList.add('hint-glow');
        }

        el.style.animationDelay = (Math.random() * 1.2).toFixed(2) + 's';
        frag.appendChild(el);
    });

    return frag;
}

function createCharacter(type) {
    const char = document.createElement('div');
    char.className = 'character' + (type !== 'hero' ? ' ' + type : '');
    char.innerHTML = `
        <div class="character-body">
            <div class="char-head"></div>
            <div class="char-torso"></div>
            <div class="char-arm left"></div>
            <div class="char-arm right"></div>
            <div class="char-leg left"></div>
            <div class="char-leg right"></div>
        </div>
    `;
    return char;
}

function addNPCs(screen, npcs) {
    if (!npcs || !npcs.length) return;
    npcs.forEach(n => {
        const char = createCharacter(n.type);
        char.style.bottom = n.y || '32%';
        char.style.left = n.x || '50%';
        const scale = n.scale || 1;
        char.style.transform = `translateX(-50%) scale(${scale})`;
        if (typeOpacity(n.type)) char.style.opacity = typeOpacity(n.type);
        screen.appendChild(char);
    });
}

function typeOpacity(type) {
    if (type === 'enemy') return '0.9';
    if (type === 'companion') return '0.85';
    return '1';
}

function createScreen(nodeId) {
    const node = STORY[nodeId];
    if (!node) return null;

    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.dataset.nodeId = nodeId;

    screen.appendChild(createBackground(node.bg));

    if (node.death) {
        spawnParticles(screen, 'rgba(220,80,100,0.6)', 18);
    } else {
        spawnParticles(screen, 'rgba(255,220,160,0.6)', 14);
    }

    screen.appendChild(createHintObjects(node.hintObjects));

    const hero = createCharacter('hero');
    hero.style.bottom = '32%';
    hero.style.left = '50%';
    hero.style.transform = 'translateX(-50%)';
    screen.appendChild(hero);

    addNPCs(screen, node.npcs);

    const panel = document.createElement('div');
    panel.className = 'content-panel';

    const card = document.createElement('div');
    card.className = 'story-card';
    if (node.death) card.classList.add('death-card');
    if (node.win) card.classList.add('win-card');

    let html = `<div class="chapter-tag">${node.chapter}</div>`;
    html += `<h2>${node.title}</h2>`;
    html += `<div class="divider"></div>`;
    html += `<p>${node.text}</p>`;

    if (node.death) {
        html += `<div class="death-hint">💀 ${node.deathText || 'Игра окончена.'}</div>`;
    } else if (node.win) {
        html += `<div class="win-hint">✅ Ты выжил. Это победа.</div>`;
    } else {
        html += '<div class="choices">';
        node.choices.forEach(c => {
            html += `<button class="choice-btn" data-next="${c.next}">${c.text}</button>`;
        });
        html += '</div>';

        if (node.hint) {
            html += `<button class="hint-btn" data-hint="1">
                <span class="hint-icon">💡</span> Подсказка
            </button>`;
            html += `<div class="hint-box" id="hintBox" style="display:none;"></div>`;
        }
    }

    if (node.death || node.win) {
        html += `<button class="restart-btn" onclick="restartGame()">↻ Начать заново</button>`;
    }

    card.innerHTML = html;
    panel.appendChild(card);
    screen.appendChild(panel);

    card.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => makeChoice(btn.dataset.next));
    });

    const hintBtn = card.querySelector('.hint-btn');
    if (hintBtn && node.hint) {
        hintBtn.addEventListener('click', () => {
            const box = card.querySelector('#hintBox');
            if (!box) return;
            if (box.style.display === 'none') {
                box.textContent = '💡 ' + node.hint;
                box.style.display = 'block';
                hintBtn.innerHTML = '<span class="hint-icon">💡</span> Скрыть подсказку';
            } else {
                box.style.display = 'none';
                hintBtn.innerHTML = '<span class="hint-icon">💡</span> Подсказка';
            }
        });
    }

    return screen;
}

function makeChoice(nextId) {
    const screens = container.querySelectorAll('.screen');
    let found = false;
    screens.forEach(s => {
        if (found) s.remove();
        if (s.dataset.nodeId === currentNodeId) found = true;
    });

    currentNodeId = nextId;
    visitedNodes.push(nextId);

    const newScreen = createScreen(nextId);
    if (newScreen) {
        container.appendChild(newScreen);
        updateDots();
        setTimeout(() => newScreen.scrollIntoView({ behavior: 'smooth' }), 80);
    }
}

function updateDots() {
    progressDots.innerHTML = '';
    const screens = container.querySelectorAll('.screen');
    screens.forEach((s, i) => {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i === screens.length - 1) dot.classList.add('active');
        const node = STORY[s.dataset.nodeId];
        if (node) {
            if (node.death) dot.classList.add('death');
            if (node.win) dot.classList.add('win');
        }
        progressDots.appendChild(dot);
    });
}

function restartGame() {
    container.innerHTML = '';
    visitedNodes = ['start'];
    currentNodeId = 'start';
    initGame();
    window.scrollTo({ top: 0, behavior: 'instant' });
}

function initGame() {
    const first = createScreen('start');
    if (first) {
        container.appendChild(first);
        visitedNodes = ['start'];
        updateDots();
    }

    const hideHint = () => {
        scrollHint.classList.add('hidden');
        window.removeEventListener('scroll', hideHint);
    };
    window.addEventListener('scroll', hideHint, { passive: true });
}

initGame();
</script>
</body>
</html>
